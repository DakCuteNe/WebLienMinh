name: Update Worldwide Esports Directory

on:
  workflow_dispatch:
  schedule:
    - cron: '42 2 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-esports.yml'
      - 'scripts/update-esports-directory.js'
      - 'data/pro-watchlist.json'

permissions:
  contents: write

concurrency:
  group: lol-esports-directory
  cancel-in-progress: true

jobs:
  update-esports:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund

      - name: Build worldwide player/team directory
        id: build
        shell: bash
        run: |
          set +e
          npm run update:esports 2>&1 | tee esports-directory.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write directory status
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.build.outputs.exit_code }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          let log = '';
          try { log = await fs.readFile('esports-directory.log', 'utf8'); } catch {}
          const code = Number(process.env.EXIT_CODE ?? -1);
          const directoryCreated = await fs.access('data/esports-directory.json').then(() => true).catch(() => false);
          const status = {
            checkedAt: new Date().toISOString(),
            health: code === 0 ? 'ok' : (directoryCreated ? 'degraded' : 'waiting'),
            exitCode: code,
            directoryCreated,
            preservedPreviousData: code !== 0 && directoryCreated,
            message: log.trim().split(/\r?\n/).filter(Boolean).slice(-30).join('\n').slice(0, 7000)
          };
          await fs.mkdir('data', { recursive: true });
          await fs.writeFile('data/esports-directory-status.json', JSON.stringify(status, null, 2));
          NODE

      - name: Commit directory and status
        if: always()
        shell: bash
        run: |
          git config user.name "WebLienMinh Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/esports-directory-status.json
          if [ -f data/esports-directory.json ]; then git add data/esports-directory.json; fi
          if git diff --cached --quiet; then
            echo "No esports directory changes."
            exit 0
          fi
          git commit -m "Update worldwide esports directory"
          git push
