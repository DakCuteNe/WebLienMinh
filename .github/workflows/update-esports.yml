name: Update Worldwide Esports Directory

on:
  workflow_dispatch:
  schedule:
    - cron: '42 2 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-esports.yml'
      - 'scripts/update-esports-directory.js'
      - 'scripts/update-esports-identities.js'
      - 'scripts/update-esports-media.js'
      - 'scripts/audit-esports-directory.js'
      - 'data/pro-watchlist.json'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: lol-esports-directory
  cancel-in-progress: true

jobs:
  update-esports:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund

      - name: Build worldwide player/team directory
        id: build
        shell: bash
        run: |
          set +e
          npm run update:esports 2>&1 | tee esports-directory.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Resolve canonical player identities and real names
        if: steps.build.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          npm run update:esports-identities 2>&1 | tee esports-identities.log
          echo "identity_exit_code=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit 0

      - name: Enrich player bios, photos and team logos
        if: steps.build.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          npm run update:esports-media 2>&1 | tee esports-media.log
          echo "media_exit_code=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit 0

      - name: Audit every esports profile
        if: steps.build.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          node scripts/audit-esports-directory.js 2>&1 | tee esports-audit.log
          echo "audit_exit_code=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit 0

      - name: Write directory status
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.build.outputs.exit_code }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          let log = '', identityLog = '', mediaLog = '', auditLog = '';
          try { log = await fs.readFile('esports-directory.log', 'utf8'); } catch {}
          try { identityLog = await fs.readFile('esports-identities.log', 'utf8'); } catch {}
          try { mediaLog = await fs.readFile('esports-media.log', 'utf8'); } catch {}
          try { auditLog = await fs.readFile('esports-audit.log', 'utf8'); } catch {}
          const code = Number(process.env.EXIT_CODE ?? -1);
          const identityCode = Number(process.env.identity_exit_code ?? process.env.IDENTITY_EXIT_CODE ?? -1);
          const mediaCode = Number(process.env.media_exit_code ?? process.env.MEDIA_EXIT_CODE ?? -1);
          const auditCode = Number(process.env.audit_exit_code ?? process.env.AUDIT_EXIT_CODE ?? -1);
          const directoryCreated = await fs.access('data/esports-directory.json').then(() => true).catch(() => false);
          const degraded = identityCode > 0 || mediaCode > 0 || auditCode > 0;
          const status = {
            checkedAt: new Date().toISOString(),
            health: code === 0 ? (degraded ? 'degraded' : 'ok') : (directoryCreated ? 'degraded' : 'waiting'),
            exitCode: code,
            identityExitCode: identityCode,
            mediaExitCode: mediaCode,
            auditExitCode: auditCode,
            directoryCreated,
            preservedPreviousData: code !== 0 && directoryCreated,
            message: [log, identityLog, mediaLog, auditLog].join('\n').trim().split(/\r?\n/).filter(Boolean).slice(-85).join('\n').slice(0, 15000)
          };
          await fs.mkdir('data', { recursive: true });
          await fs.writeFile('data/esports-directory-status.json', JSON.stringify(status, null, 2));
          NODE

      - name: Commit directory, audit and status
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name "WebLienMinh Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/esports-directory-status.json
          if [ -f data/esports-directory.json ]; then git add data/esports-directory.json; fi
          if [ -f data/esports-audit.json ]; then git add data/esports-audit.json; fi

          if git diff --cached --quiet; then
            echo "No esports directory changes."
            exit 0
          fi

          git commit -m "Update worldwide esports directory"

          for ATTEMPT in 1 2 3 4 5; do
            echo "Push attempt ${ATTEMPT}/5"
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((ATTEMPT * 2))
          done

          echo "Push failed after 5 attempts."
          exit 1
