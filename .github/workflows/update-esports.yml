name: Update Worldwide Esports Directory

on:
  workflow_dispatch:
  schedule:
    - cron: '42 2 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-esports.yml'
      - 'scripts/update-esports-directory.js'
      - 'scripts/update-esports-identities.js'
      - 'scripts/update-esports-media.js'
      - 'scripts/audit-esports-directory.js'
      - 'data/pro-watchlist.json'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: lol-esports-directory
  cancel-in-progress: true

jobs:
  update-esports:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund

      - name: Build worldwide player/team directory
        id: build
        shell: bash
        run: |
          set +e
          npm run update:esports 2>&1 | tee esports-directory.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Resolve canonical player identities and real names
        id: identity
        if: steps.build.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          npm run update:esports-identities 2>&1 | tee esports-identities.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Enrich player bios, photos and team logos
        id: media
        if: steps.build.outputs.exit_code == '0' && steps.identity.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          npm run update:esports-media 2>&1 | tee esports-media.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Audit every esports profile
        id: audit
        if: steps.build.outputs.exit_code == '0' && steps.identity.outputs.exit_code == '0' && steps.media.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          node scripts/audit-esports-directory.js 2>&1 | tee esports-audit.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write directory status
        if: always()
        shell: bash
        env:
          BUILD_CODE: ${{ steps.build.outputs.exit_code }}
          IDENTITY_CODE: ${{ steps.identity.outputs.exit_code }}
          MEDIA_CODE: ${{ steps.media.outputs.exit_code }}
          AUDIT_CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          let buildLog = '', identityLog = '', mediaLog = '', auditLog = '';
          try { buildLog = await fs.readFile('esports-directory.log', 'utf8'); } catch {}
          try { identityLog = await fs.readFile('esports-identities.log', 'utf8'); } catch {}
          try { mediaLog = await fs.readFile('esports-media.log', 'utf8'); } catch {}
          try { auditLog = await fs.readFile('esports-audit.log', 'utf8'); } catch {}
          const toCode = value => value === '' || value == null ? -1 : Number(value);
          const buildCode = toCode(process.env.BUILD_CODE);
          const identityCode = toCode(process.env.IDENTITY_CODE);
          const mediaCode = toCode(process.env.MEDIA_CODE);
          const auditCode = toCode(process.env.AUDIT_CODE);
          const directoryCreated = await fs.access('data/esports-directory.json').then(() => true).catch(() => false);
          const complete = buildCode === 0 && identityCode === 0 && mediaCode === 0 && auditCode === 0;
          const tail = (value, count = 35) => value.trim().split(/\r?\n/).filter(Boolean).slice(-count).join('\n');
          const status = {
            checkedAt: new Date().toISOString(),
            health: complete ? 'ok' : (directoryCreated ? 'degraded' : 'waiting'),
            exitCode: buildCode,
            identityExitCode: identityCode,
            mediaExitCode: mediaCode,
            auditExitCode: auditCode,
            directoryCreated,
            publishReady: complete,
            preservedPreviousData: !complete && directoryCreated,
            identityMessage: tail(identityLog, 45),
            message: [tail(buildLog, 15), tail(mediaLog, 25), tail(auditLog, 25)].filter(Boolean).join('\n').slice(0, 14000)
          };
          await fs.mkdir('data', { recursive: true });
          await fs.writeFile('data/esports-directory-status.json', JSON.stringify(status, null, 2));
          NODE

      - name: Commit directory, audit and status
        if: always()
        shell: bash
        env:
          BUILD_CODE: ${{ steps.build.outputs.exit_code }}
          IDENTITY_CODE: ${{ steps.identity.outputs.exit_code }}
          MEDIA_CODE: ${{ steps.media.outputs.exit_code }}
          AUDIT_CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          set -e
          git config user.name "WebLienMinh Bot"
          git config user.email "actions@users.noreply.github.com"

          COMPLETE=0
          if [ "${BUILD_CODE:--1}" = "0" ] && \
             [ "${IDENTITY_CODE:--1}" = "0" ] && \
             [ "${MEDIA_CODE:--1}" = "0" ] && \
             [ "${AUDIT_CODE:--1}" = "0" ]; then
            COMPLETE=1
          fi

          if [ "$COMPLETE" = "1" ]; then
            echo "All esports stages completed; publishing new directory."
            git add data/esports-directory.json data/esports-audit.json
          else
            echo "Esports run incomplete/cancelled; preserving last committed directory and audit."
            git restore --worktree --staged data/esports-directory.json 2>/dev/null || true
            git restore --worktree --staged data/esports-audit.json 2>/dev/null || true
          fi
          git add data/esports-directory-status.json

          if git diff --cached --quiet; then
            echo "No esports changes."
            exit 0
          fi

          git commit -m "Update worldwide esports directory"

          for ATTEMPT in 1 2 3 4 5; do
            echo "Push attempt ${ATTEMPT}/5"
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((ATTEMPT * 2))
          done

          echo "Push failed after 5 attempts."
          exit 1
