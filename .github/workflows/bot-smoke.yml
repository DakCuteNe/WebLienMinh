name: Discord Bot Smoke

on:
  pull_request:
    paths:
      - 'bot/**'
      - '.env.example'
      - 'package.json'
      - '.github/workflows/bot-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - '.env.example'
      - 'package.json'
      - '.github/workflows/bot-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check bot/bot.js
          node --check bot/news-watcher.js
          node --check bot/meta-watcher.js
      - name: Verify notify-only hard reset
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('bot/bot.js', 'utf8');
          const envExample = fs.readFileSync('.env.example', 'utf8');
          const legacy = ['meta', 'counter', 'build', 'pro', 'patch', 'status'];
          const currentDomain = 'https://metalienminh.up.railway.app';
          const oldDomain = 'https://weblienminh-production.up.railway.app';
          if (!source.includes(".setName('notify')")) throw new Error('Missing /notify command');
          for (const name of legacy) {
            if (source.includes(`interaction.commandName === '${name}'`)) {
              throw new Error(`Legacy handler still active: /${name}`);
            }
          }
          if (!source.includes('clearAllGlobalCommands')) throw new Error('Missing global hard-reset helper');
          if (!source.includes('clearAllGuildCommands')) throw new Error('Missing guild hard-reset helper');
          if (!source.includes('Routes.applicationCommands(CLIENT_ID), { body: [] }')) {
            throw new Error('Global command list is not hard-reset with an empty bulk overwrite');
          }
          if (!source.includes('Routes.applicationGuildCommands(CLIENT_ID, guildId), { body: [] }')) {
            throw new Error('Guild command list is not hard-reset with an empty bulk overwrite');
          }
          if (source.includes('MANAGED_COMMAND_NAMES')) throw new Error('Name-based cleanup is still present');
          if (!source.includes("Riot News & Meta • /notify")) throw new Error('Bot activity still references an old command');
          if (!source.includes(currentDomain)) throw new Error('Bot does not contain the new MetaLienMinh domain');
          if (!source.includes(`LEGACY_WEB_API_URL = '${oldDomain}'`)) throw new Error('Missing automatic migration from the old Railway domain');
          if (!envExample.includes(`WEB_API_URL=${currentDomain}`)) throw new Error('.env.example still points at an old website');
          console.log('Discord bot is /notify-only, hard-reset enabled, and points to MetaLienMinh.');
          NODE
