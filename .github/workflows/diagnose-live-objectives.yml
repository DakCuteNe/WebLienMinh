name: Diagnose Riot live objective shape

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-live-objectives.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/diagnose-live-objective-shape.js
