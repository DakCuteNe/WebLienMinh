name: Diagnose Riot live objective shape

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-live-objectives.yml'
      - 'scripts/diagnose-live-objective-shape.js'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/diagnose-live-objective-shape.js
