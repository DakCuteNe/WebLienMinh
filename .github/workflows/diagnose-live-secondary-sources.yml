name: Diagnose live secondary sources

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-live-secondary-sources.yml'
      - 'scripts/diagnose-live-secondary-sources.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Start WebLienMinh
        run: |
          npm start > /tmp/weblienminh-diagnostic.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/status >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/weblienminh-diagnostic.log
          exit 1
      - name: Diagnose sources
        run: node scripts/diagnose-live-secondary-sources.js 2>&1 | tee /tmp/live-secondary-diagnostic.txt
      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-secondary-diagnostic
          path: /tmp/live-secondary-diagnostic.txt
          retention-days: 1
