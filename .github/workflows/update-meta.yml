name: Auto Update LoL Meta

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-meta.yml'
      - 'scripts/collect-high-elo.js'
      - 'scripts/aggregate.js'
      - 'scripts/finalize-global-meta.js'
      - 'scripts/update-riot-data.js'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: lol-meta-auto-update
  cancel-in-progress: true

jobs:
  update-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      DDRAGON_LOCALE: vi_VN
      GLOBAL_PLAYERS_PER_PLATFORM: 2
      GLOBAL_MATCHES_PER_PLAYER: 6
      MIN_GLOBAL_PLATFORMS: 10
      MIN_GLOBAL_MATCHES: 80
      MIN_GLOBAL_MACRO_REGIONS: 4
      RIOT_REQUEST_DELAY_MS: 1350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Update Riot static data
        id: riot
        shell: bash
        run: |
          set +e
          npm run update:riot 2>&1 | tee riot-static.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect worldwide high-elo matches
        id: collect
        if: always()
        shell: bash
        run: |
          set +e
          if [ -z "$RIOT_API_KEY" ]; then
            echo "RIOT_API_KEY secret is missing." | tee collector.log
            echo "exit_code=98" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run collect:high-elo 2>&1 | tee collector.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Aggregate worldwide current-patch meta
        id: aggregate
        if: always()
        shell: bash
        run: |
          set +e
          shopt -s nullglob
          matches=(data/matches/*.json)
          if (( ${#matches[@]} > 0 )) && [ "${{ steps.collect.outputs.exit_code }}" = "0" ]; then
            if [ -f data/meta.json ]; then cp data/meta.json data/meta.previous.json; fi

            npm run aggregate 2>&1 | tee aggregate.log
            CODE=${PIPESTATUS[0]}

            if [ "$CODE" -eq 0 ]; then
              npm run finalize:global 2>&1 | tee -a aggregate.log
              FINAL_CODE=${PIPESTATUS[0]}
              if [ "$FINAL_CODE" -ne 0 ]; then CODE=$FINAL_CODE; fi
            fi

            if [ "$CODE" -ne 0 ] && [ -f data/meta.previous.json ]; then
              mv data/meta.previous.json data/meta.json
              echo "Aggregate/finalize failed; restored previous meta.json." | tee -a aggregate.log
            else
              rm -f data/meta.previous.json
            fi
            echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          else
            echo "No accepted worldwide dataset. Keeping previous meta.json." | tee aggregate.log
            echo "exit_code=97" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Write automation status
        if: always()
        shell: bash
        env:
          RIOT_STATIC_EXIT_CODE: ${{ steps.riot.outputs.exit_code }}
          COLLECT_EXIT_CODE: ${{ steps.collect.outputs.exit_code }}
          AGGREGATE_EXIT_CODE: ${{ steps.aggregate.outputs.exit_code }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          async function tail(file) {
            try {
              const text = await fs.readFile(file, 'utf8');
              return text.trim().split(/\r?\n/).filter(Boolean).slice(-14).join('\n').slice(0, 4500);
            } catch { return ''; }
          }
          async function json(file, fallback = null) {
            try { return JSON.parse(await fs.readFile(file, 'utf8')); } catch { return fallback; }
          }

          const patchState = await json('data/riot/patch.json', {});
          const coverage = await json('data/global-coverage.json', null);
          const staticCode = Number(process.env.RIOT_STATIC_EXIT_CODE ?? -1);
          const collectCode = Number(process.env.COLLECT_EXIT_CODE ?? -1);
          const aggregateCode = Number(process.env.AGGREGATE_EXIT_CODE ?? -1);
          const health = staticCode === 0 && collectCode === 0 && aggregateCode === 0 ? 'ok' : 'degraded';

          const status = {
            checkedAt: new Date().toISOString(),
            health,
            scope: 'GLOBAL',
            patch: patchState.patch || null,
            dataDragonVersion: patchState.version || patchState.dataDragonVersion || null,
            riotSecretConfigured: Boolean(process.env.RIOT_API_KEY),
            riotStaticExitCode: staticCode,
            collectorExitCode: collectCode,
            aggregateExitCode: aggregateCode,
            preservedPreviousMeta: collectCode !== 0 || aggregateCode !== 0,
            globalCoverage: coverage ? {
              accepted: Boolean(coverage.accepted),
              platformCount: coverage.platformCount || 0,
              attemptedPlatforms: coverage.attemptedPlatforms?.length || 16,
              macroRegionCount: coverage.macroRegionCount || 0,
              matchesSaved: coverage.matchesSaved || 0,
              successfulPlatforms: coverage.successfulPlatforms || [],
              matchesByMacroRegion: coverage.matchesByMacroRegion || {}
            } : null,
            riotStaticMessage: await tail('riot-static.log'),
            collectorMessage: await tail('collector.log'),
            aggregateMessage: await tail('aggregate.log')
          };
          await fs.mkdir('data', { recursive: true });
          await fs.writeFile('data/automation-status.json', JSON.stringify(status, null, 2));
          NODE

      - name: Commit updated worldwide Riot/meta data
        if: always()
        shell: bash
        run: |
          git config user.name "WebLienMinh Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/riot data/automation-status.json
          if [ -f data/meta.json ]; then git add data/meta.json; fi
          if [ -f data/high-elo-seeds.json ]; then git add data/high-elo-seeds.json; fi
          if [ -f data/global-coverage.json ]; then git add data/global-coverage.json; fi

          if git diff --cached --quiet; then
            echo "No worldwide Riot/meta changes to commit."
            exit 0
          fi

          PATCH=$(node -e "try{console.log(require('./data/riot/patch.json').patch||'live')}catch{console.log('live')}")
          git commit -m "Auto update Global LoL meta ${PATCH}"
          git push
