name: Auto Update LoL Meta

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-meta.yml'
      - 'scripts/**'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: lol-meta-auto-update
  cancel-in-progress: false

jobs:
  update-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      RIOT_PLATFORM: vn2
      RIOT_REGION: sea
      DDRAGON_LOCALE: vi_VN
      HIGH_ELO_PLAYERS: 5
      MATCHES_PER_PLAYER: 10
      RIOT_REQUEST_DELAY_MS: 1300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Update Riot static data
        id: riot
        run: npm run update:riot

      - name: Collect Challenger VN2 matches
        id: collect
        continue-on-error: true
        shell: bash
        run: |
          if [ -z "$RIOT_API_KEY" ]; then
            echo "::warning::RIOT_API_KEY secret is missing. Skipping Match-V5 collector."
            exit 0
          fi
          npm run collect:high-elo

      - name: Aggregate current patch meta
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          matches=(data/matches/*.json)
          if (( ${#matches[@]} > 0 )); then
            npm run aggregate
          else
            echo "::warning::No current-patch matches were collected; keeping the previous meta.json."
          fi

      - name: Commit updated Riot/meta data
        if: always()
        shell: bash
        run: |
          git config user.name "WebLienMinh Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/riot
          if [ -f data/meta.json ]; then
            git add data/meta.json
          fi

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          PATCH="${{ steps.riot.outputs.patch }}"
          VERSION="${{ steps.riot.outputs.version }}"
          git commit -m "Auto update LoL meta ${PATCH:-live} (${VERSION:-Riot})"
          git push
