name: Auto Update LoL Meta

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-meta.yml'
      - 'scripts/**'
      - 'data/pro-watchlist.json'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: lol-meta-auto-update
  cancel-in-progress: false

jobs:
  update-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      RIOT_PLATFORM: vn2
      RIOT_REGION: sea
      DDRAGON_LOCALE: vi_VN
      HIGH_ELO_PLAYERS: 10
      MATCHES_PER_PLAYER: 20
      RIOT_REQUEST_DELAY_MS: 1300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Update Riot static data
        id: riot
        run: npm run update:riot

      - name: Collect Challenger VN2 matches
        id: collect
        shell: bash
        run: |
          set +e
          if [ -z "$RIOT_API_KEY" ]; then
            echo "RIOT_API_KEY secret is missing." | tee collector.log
            echo "exit_code=98" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run collect:high-elo 2>&1 | tee collector.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Aggregate current patch meta
        id: aggregate
        if: always()
        shell: bash
        run: |
          set +e
          shopt -s nullglob
          matches=(data/matches/*.json)
          if (( ${#matches[@]} > 0 )); then
            npm run aggregate 2>&1 | tee aggregate.log
            CODE=${PIPESTATUS[0]}
            echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          else
            echo "No current-patch matches were collected; keeping the previous meta.json." | tee aggregate.log
            echo "exit_code=97" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Update featured pro analytics
        id: pros
        if: always()
        shell: bash
        run: |
          set +e
          npm run update:pros 2>&1 | tee pros.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write automation status
        if: always()
        shell: bash
        env:
          COLLECT_EXIT_CODE: ${{ steps.collect.outputs.exit_code }}
          AGGREGATE_EXIT_CODE: ${{ steps.aggregate.outputs.exit_code }}
          PROS_EXIT_CODE: ${{ steps.pros.outputs.exit_code }}
          PATCH: ${{ steps.riot.outputs.patch }}
          DD_VERSION: ${{ steps.riot.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          async function tail(file) {
            try {
              const text = await fs.readFile(file, 'utf8');
              return text.trim().split(/\r?\n/).filter(Boolean).slice(-8).join('\n').slice(0, 2000);
            } catch { return ''; }
          }
          const status = {
            checkedAt: new Date().toISOString(),
            patch: process.env.PATCH || null,
            dataDragonVersion: process.env.DD_VERSION || null,
            riotSecretConfigured: Boolean(process.env.RIOT_API_KEY),
            collectorExitCode: Number(process.env.COLLECT_EXIT_CODE || -1),
            aggregateExitCode: Number(process.env.AGGREGATE_EXIT_CODE || -1),
            prosExitCode: Number(process.env.PROS_EXIT_CODE || -1),
            collectorMessage: await tail('collector.log'),
            aggregateMessage: await tail('aggregate.log'),
            prosMessage: await tail('pros.log')
          };
          await fs.mkdir('data', { recursive: true });
          await fs.writeFile('data/automation-status.json', JSON.stringify(status, null, 2));
          NODE

      - name: Commit updated analytics data
        if: always()
        shell: bash
        run: |
          git config user.name "WebLienMinh Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/riot data/automation-status.json
          if [ -f data/meta.json ]; then git add data/meta.json; fi
          if [ -f data/pros.json ]; then git add data/pros.json; fi

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          PATCH="${{ steps.riot.outputs.patch }}"
          VERSION="${{ steps.riot.outputs.version }}"
          git commit -m "Auto update LoL analytics ${PATCH:-live} (${VERSION:-Riot})"
          git push
