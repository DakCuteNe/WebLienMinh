name: Delete merged live objective branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-live-objective-branch.yml'

permissions:
  contents: write

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete merged branch
        run: git push origin --delete feat/live-objective-details
