name: Live Match Smoke

on:
  pull_request:
    paths:
      - 'server/esports-match-live.js'
      - 'server/esports-match-bootstrap.js'
      - 'public/js/match-live.js'
      - 'public/match-live.css'
      - 'public/js/team-predictions.js'
      - 'public/team-predictions.css'
      - 'public/js/riot-music.js'
      - 'public/riot-music.css'
      - 'public/js/site-effects.js'
      - 'public/site-effects.css'
      - 'public/js/together-finisher.js'
      - 'public/together-finisher.css'
      - 'public/js/ambient.js'
      - 'public/ambient.css'
      - 'public/js/assets.js'
      - 'public/assets-library.css'
      - 'public/js/hall-of-legends.js'
      - 'public/hall-of-legends.css'
      - 'public/app.js'
      - 'scripts/smoke-live-match.js'
      - 'package.json'
      - '.github/workflows/live-match-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'server/esports-match-live.js'
      - 'server/esports-match-bootstrap.js'
      - 'public/js/match-live.js'
      - 'public/match-live.css'
      - 'public/js/team-predictions.js'
      - 'public/team-predictions.css'
      - 'public/js/riot-music.js'
      - 'public/riot-music.css'
      - 'public/js/site-effects.js'
      - 'public/site-effects.css'
      - 'public/js/together-finisher.js'
      - 'public/together-finisher.css'
      - 'public/js/ambient.js'
      - 'public/ambient.css'
      - 'public/js/assets.js'
      - 'public/assets-library.css'
      - 'public/js/hall-of-legends.js'
      - 'public/hall-of-legends.css'
      - 'public/app.js'
      - 'scripts/smoke-live-match.js'
      - 'package.json'
      - '.github/workflows/live-match-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check server/esports-match-live.js
          node --check server/esports-match-bootstrap.js
          node --check public/js/match-live.js
          node --check public/js/team-predictions.js
          node --check public/js/riot-music.js
          node --check public/js/site-effects.js
          node --check public/js/together-finisher.js
          node --check public/js/ambient.js
          node --check public/js/assets.js
          node --check public/js/hall-of-legends.js
          node --check public/app.js
          node --check scripts/smoke-live-match.js
      - name: Verify Together as 1 v3 only
        run: |
          grep -q 'together-finisher-v3' public/js/together-finisher.js
          grep -q 'together-finisher-v3' public/together-finisher.css
          grep -q 'TOGETHER_FINISHER_DURATION = 6200' public/js/together-finisher.js
          grep -q "APP_VERSION = '3.13.0'" public/app.js
          if grep -Eq 'together-finisher-v2|worlds-takeover' public/js/together-finisher.js public/together-finisher.css public/js/site-effects.js public/site-effects.css; then
            echo 'Legacy Together v2 / Worlds takeover markup is still present.'
            exit 1
          fi
      - name: Verify Hall of Legends official roster and visual upgrade
        run: |
          grep -q "VERSION = '3.14.0'" public/js/hall-of-legends.js
          grep -q "player: 'Faker'" public/js/hall-of-legends.js
          grep -q "player: 'Uzi'" public/js/hall-of-legends.js
          grep -q "mediaKey: 'Uzi (Jian Zi-Hao)'" public/js/hall-of-legends.js
          grep -q "teamMediaKey: 'Royal Never Give Up'" public/js/hall-of-legends.js
          grep -q "activeYear = 2025" public/js/hall-of-legends.js
          grep -q "2026 • SẮP TỚI" public/js/hall-of-legends.js
          grep -q "tuyển thủ thứ ba hiện chưa được công bố" public/js/hall-of-legends.js
          grep -q 'hol-official-banner' public/hall-of-legends.css
          grep -q 'hol-team-logo' public/hall-of-legends.css
          grep -q 'hol-trophy-grid' public/hall-of-legends.css
          grep -q 'hol-card-pending' public/hall-of-legends.css
          if grep -q "player: 'Caps'" public/js/hall-of-legends.js; then
            echo 'Unannounced 2026 Hall of Legends player must not be presented as official.'
            exit 1
          fi
          grep -q 'initHallOfLegends' public/app.js
          grep -q 'ensureHallOfLegends' public/app.js
          grep -q 'hol-section' public/hall-of-legends.css
      - name: Start WebLienMinh
        run: |
          npm start > /tmp/weblienminh.log 2>&1 &
          echo $! > /tmp/weblienminh.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/status >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/weblienminh.log
          exit 1
      - name: Resolve official upcoming match through live endpoint
        run: node scripts/smoke-live-match.js
      - name: Server log
        if: always()
        run: cat /tmp/weblienminh.log || true
