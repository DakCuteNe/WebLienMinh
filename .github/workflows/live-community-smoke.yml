name: Live Community Fallback Smoke

on:
  push:
    branches: [main]
    paths:
      - 'server/esports-match-community-fallback.js'
      - 'server/esports-match-community-multigame.js'
      - 'server/esports-match-community-overlay.js'
      - 'server/esports-match-bootstrap.js'
      - 'scripts/smoke-live-match-community.js'
      - 'scripts/smoke-live-match-multigame.js'
      - '.github/workflows/live-community-smoke.yml'
  pull_request:
    paths:
      - 'server/esports-match-community-fallback.js'
      - 'server/esports-match-community-multigame.js'
      - 'server/esports-match-community-overlay.js'
      - 'server/esports-match-bootstrap.js'
      - 'scripts/smoke-live-match-community.js'
      - 'scripts/smoke-live-match-multigame.js'
      - '.github/workflows/live-community-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check server/esports-match-community-fallback.js
          node --check server/esports-match-community-multigame.js
          node --check server/esports-match-community-overlay.js
          node --check server/esports-match-bootstrap.js
          node --check scripts/smoke-live-match-community.js
          node --check scripts/smoke-live-match-multigame.js
      - name: Ban, objective and score regression
        run: |
          node scripts/smoke-live-match-community.js
          node scripts/smoke-live-match-multigame.js
