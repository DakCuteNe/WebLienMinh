name: Delete merged live fix branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-live-fix-branch.yml'

permissions:
  contents: write

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete merged branch
        run: git push origin --delete fix/live-match-game-history-refresh
