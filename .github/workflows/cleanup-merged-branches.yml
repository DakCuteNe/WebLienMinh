name: One-shot cleanup merged branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-merged-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete remote branches already merged into main
        shell: bash
        run: |
          set -u
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          deleted=0
          failures=0

          while IFS= read -r ref; do
            branch="${ref#origin/}"
            if [[ -z "$branch" || "$branch" == "HEAD" || "$branch" == "main" ]]; then
              continue
            fi

            if git merge-base --is-ancestor "origin/$branch" origin/main; then
              echo "Deleting merged branch: $branch"
              if git push origin --delete "$branch"; then
                deleted=$((deleted + 1))
              else
                echo "Failed to delete: $branch"
                failures=$((failures + 1))
              fi
            else
              echo "Keeping unmerged branch: $branch"
            fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin | sort)

          echo "Deleted merged branches: $deleted"
          echo "Deletion failures: $failures"
          if (( failures > 0 )); then
            exit 1
          fi

      - name: Remove one-shot cleanup workflow
        if: success()
        shell: bash
        run: |
          git config user.name "WebLienMinh Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/cleanup-merged-branches.yml
          git commit -m "Remove one-shot merged branch cleanup"
          git push origin HEAD:main
